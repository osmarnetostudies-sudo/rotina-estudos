<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAnkJmq6h-NDIgL1WlhRij5YB7H0MNrIw4",
    authDomain: "plantao-sync.firebaseapp.com",
    projectId: "plantao-sync",
    storageBucket: "plantao-sync.firebasestorage.app",
    messagingSenderId: "359789272473",
    appId: "1:359789272473:web:a0e3ed2a769fe07e72c708"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const docRef = code => doc(db, 'sync', code);

  let unsub = null;
  let pushTimer = null;

  window.__sync = {
    push(code, deviceId, payload, updatedAt, done){
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => {
        setDoc(docRef(code), Object.assign({}, payload, {updatedBy: deviceId, updatedAt: updatedAt || Date.now()}))
          .then(() => done && done(true))
          .catch(err => { console.error('sync push failed', err); done && done(false); });
      }, 900);
    },
    async join(code){
      try{
        const snap = await getDoc(docRef(code));
        return {ok:true, data: snap.exists() ? snap.data() : null};
      }catch(err){ console.error('sync join failed', err); return {ok:false, data:null}; }
    },
    subscribe(code, deviceId, onRemote, onStatus){
      if(unsub) unsub();
      unsub = onSnapshot(docRef(code), snap => {
        onStatus && onStatus(true);
        if(!snap.exists()){ onRemote(null, true); return; }
        const data = snap.data();
        if(data.updatedBy === deviceId){ onRemote(data, false); return; }
        onRemote(data, true);
      }, err => { console.error('sync subscribe failed', err); onStatus && onStatus(false); });
    },
    unsubscribe(){
      if(unsub){ unsub(); unsub = null; }
    }
  };
  window.dispatchEvent(new Event('sync-ready'));
</script>

<style>
/* Layout: monitor de plantão escuro no topo (os sinais vitais do estudo), abas fixas, painel em duas colunas no PC e barra de abas embaixo no celular */
:root{
  color-scheme: light;
  --bg:#edf2f0; --surface:#ffffff; --surface-2:#f3f7f5; --sunken:#e6eeea;
  --ink:#0f1f1b; --ink-2:#4a5d57; --ink-3:#83948e;
  --line:#dde7e3; --line-2:#c7d5cf;
  --accent:#0b8a78; --accent-ink:#ffffff;
  --good:#15925e; --warn:#c98208; --crit:#d0344d;
  --s1:#2563c9; --s2:#cf7a0b; --s3:#13915b; --s4:#7a4cd4; --s5:#cc3c84;
  --heat-0:#e2eae6; --heat-1:#bfe3d9; --heat-2:#6cc3ad; --heat-3:#1f9a83; --heat-4:#0c5e50;
  --pessoal:#c2410c;
  --mon-bg:#0c1916; --mon-panel:#13241f; --mon-line:#21372f; --mon-ink:#e8f4f0; --mon-dim:#86a99d; --trace:#3be39c;
  --shadow:0 1px 2px rgba(15,31,27,.05), 0 6px 20px -10px rgba(15,31,27,.18);
  --display:'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* nomes antigos, mantidos para o que ainda usa */
  --text-primary:var(--ink); --text-secondary:var(--ink-2); --text-muted:var(--ink-3);
  --gridline:var(--line); --border:var(--line); --surface-1:var(--surface);
  --critical:var(--crit); --warning:var(--warn); --good-text:var(--good);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#08100e; --surface:#111b18; --surface-2:#16221e; --sunken:#1f2e29;
    --ink:#eaf3ef; --ink-2:#a8bbb4; --ink-3:#6c8179;
    --line:#1f2d28; --line-2:#2c3d37;
    --accent:#2ec4a7; --accent-ink:#06201a;
    --good:#3cc98a; --warn:#f0b24a; --crit:#f0657b;
    --s1:#6ea3f2; --s2:#f0a23d; --s3:#3fca8b; --s4:#a888f2; --s5:#ef77b3;
    --heat-0:#1a2622; --heat-1:#174a3f; --heat-2:#1d7c69; --heat-3:#2fb497; --heat-4:#8ff0d6;
    --mon-bg:#040a08; --mon-panel:#0c1714; --mon-line:#1a2c26; --pessoal:#fb8a4c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#08100e; --surface:#111b18; --surface-2:#16221e; --sunken:#1f2e29;
  --ink:#eaf3ef; --ink-2:#a8bbb4; --ink-3:#6c8179;
  --line:#1f2d28; --line-2:#2c3d37;
  --accent:#2ec4a7; --accent-ink:#06201a;
  --good:#3cc98a; --warn:#f0b24a; --crit:#f0657b;
  --s1:#6ea3f2; --s2:#f0a23d; --s3:#3fca8b; --s4:#a888f2; --s5:#ef77b3;
  --heat-0:#1a2622; --heat-1:#174a3f; --heat-2:#1d7c69; --heat-3:#2fb497; --heat-4:#8ff0d6;
  --mon-bg:#040a08; --mon-panel:#0c1714; --mon-line:#1a2c26; --pessoal:#fb8a4c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em;}
.spacer{flex:1 1 auto;}
.muted{color:var(--ink-3);}
.small{font-size:13px;}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.col{display:flex;flex-direction:column;gap:10px;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

/* ---------- monitor (topo) ---------- */
header.mon{background:var(--mon-bg);color:var(--mon-ink);position:relative;overflow:hidden;}
header.mon::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--mon-line) 1px,transparent 1px),linear-gradient(90deg,var(--mon-line) 1px,transparent 1px);
  background-size:22px 22px;mask-image:linear-gradient(180deg,#000 0%,transparent 95%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 95%);}
.mon-in{position:relative;max-width:1000px;margin:0 auto;padding:14px 16px 14px;display:flex;flex-direction:column;gap:14px;}
.mon-top{display:flex;align-items:center;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--trace) 16%,transparent);color:var(--trace);border:1px solid color-mix(in srgb,var(--trace) 35%,transparent);}
.brand-mark .ic{width:20px;height:20px;}
.brand small{display:block;font:500 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mon-dim);}
.sync-pill{font:500 11.5px var(--mono);color:var(--mon-dim);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:var(--mon-panel);border:1px solid var(--mon-line);}
.sync-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--trace);box-shadow:0 0 8px var(--trace);}
.sync-pill.enviando::before{background:#f0b24a;box-shadow:0 0 8px #f0b24a;}
.sync-pill.erro::before{background:#f0657b;box-shadow:0 0 8px #f0657b;}
.mon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--mon-panel);border:1px solid var(--mon-line);color:var(--mon-ink);}
.mon-btn:hover{border-color:var(--mon-dim);}

.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.vital{background:var(--mon-panel);border:1px solid var(--mon-line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;color:var(--mon-ink);}
button.vital:hover{border-color:var(--mon-dim);}
.v-lbl{display:flex;align-items:center;gap:6px;font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mon-dim);}
.v-num{font:700 26px/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.v-num small{font-size:12px;font-weight:500;color:var(--mon-dim);margin-left:4px;letter-spacing:0;}
.v-txt{font-size:13.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.vital.c-streak .v-num{color:#ffb35c;} .vital.c-streak .v-lbl .ic{color:#ffb35c;}
.vital.c-pend .v-num{color:#ff8fa3;}   .vital.c-pend .v-lbl .ic{color:#ff8fa3;}
.vital.c-today .v-num{color:var(--trace);} .vital.c-today .v-lbl .ic{color:var(--trace);}
.vital.c-next .v-lbl .ic{color:#8fc1ff;}
.vital .badge{margin-top:4px;align-self:flex-start;}

.trace-box{display:flex;flex-direction:column;gap:4px;}
.trace-svg{width:100%;height:46px;display:block;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--trace) 60%,transparent));}
.trace-days{display:grid;grid-template-columns:repeat(7,1fr);font:500 10.5px var(--mono);color:var(--mon-dim);text-align:center;letter-spacing:.06em;}
.trace-days span.hoje{color:var(--trace);font-weight:700;}

/* ---------- abas ---------- */
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 6px 18px -16px rgba(0,0,0,.5);}
nav.tabs{max-width:1000px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
nav.tabs button{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink-2);padding:13px 14px 11px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap;}
nav.tabs button .ic{color:var(--ink-3);}
nav.tabs button:hover{color:var(--ink);}
nav.tabs button.active{color:var(--ink);border-bottom-color:var(--accent);}
nav.tabs button.active .ic{color:var(--accent);}
.tab-count{font:600 11px var(--mono);background:var(--crit);color:#fff;border-radius:999px;padding:1px 7px;}
nav.bottom{display:none;}

/* ---------- sessão em andamento ---------- */
.active-bar{border-top:1px solid var(--line);background:color-mix(in srgb,var(--c) 9%,var(--surface));}
.active-bar-inner{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.ab-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:#fff;}
.ab-meta{display:flex;flex-direction:column;min-width:0;}
.ab-meta .name{font-weight:700;font-size:14.5px;}
.ab-meta .sub{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--crit);animation:pulse 1.4s ease-in-out infinite;}
.live-dot.off{background:var(--ink-3);animation:none;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.75);}}
.clock{font:700 26px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--c);}

/* ---------- conteúdo ---------- */
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px;}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 16px;}
.greet h1{margin:0;font:800 clamp(24px,4.2vw,32px)/1.1 var(--display);letter-spacing:-.035em;text-wrap:balance;}
.greet p{margin:2px 0 0;color:var(--ink-2);font-size:14.5px;}
.hoje-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0;}
.wrap > .card + .card, .wrap > .card + .grid2, .wrap > .grid2 + .card{margin-top:16px;}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.card-h h2{margin:0;font:700 17px/1.2 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:9px;}
.h-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--hc,var(--accent)) 14%,transparent);color:var(--hc,var(--accent));flex:none;}
.h-ic .ic{width:17px;height:17px;}
.card-h .sub{font-size:12.5px;color:var(--ink-3);}
.card h3{margin:18px 0 8px;font:600 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px;}
.card h3:first-of-type{margin-top:4px;}
.card h3 .today-tag{color:var(--accent);}
.hint{font-size:13px;color:var(--ink-3);margin:-6px 0 12px;}
.empty{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:14px;}
.empty .ic{color:var(--accent);width:20px;height:20px;}

/* chips e selos */
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;padding:3px 9px 3px 7px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap;}
.chip .ic{width:13px;height:13px;}
.badge{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;}
.badge.hot{color:#fff;background:var(--crit);border-color:var(--crit);}
.badge.good{color:#fff;background:var(--good);border-color:var(--good);}
.badge.warn{color:#241500;background:var(--warn);border-color:var(--warn);}
.badge.soft{background:var(--surface-2);border-color:transparent;}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s,transform .1s;}
.btn:hover{background:var(--surface-2);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent);}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff;}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink);}
.btn.wide{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-only{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;border:none;background:transparent;color:var(--ink-3);flex:none;}
.icon-only:hover{background:var(--surface-2);color:var(--crit);}

/* agenda (linha do tempo) */
.tl{display:flex;flex-direction:column;}
.tl-item{display:grid;grid-template-columns:64px 18px minmax(0,1fr);gap:10px;align-items:stretch;}
.tl-time{font:600 12.5px/1.3 var(--mono);color:var(--ink);text-align:right;padding-top:9px;font-variant-numeric:tabular-nums;}
.tl-time span{display:block;color:var(--ink-3);font-weight:500;}
.tl-rail{position:relative;display:flex;justify-content:center;}
.tl-rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line);}
.tl-item:first-child .tl-rail::before{top:14px;}
.tl-item:last-child .tl-rail::before{bottom:calc(100% - 14px);}
.tl-dot{position:relative;margin-top:10px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--c);}
.tl-item.livre .tl-dot{border-color:var(--line-2);border-style:dashed;}
.tl-item.now .tl-dot{background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent);}
.tl-body{margin:4px 0;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 9%,transparent);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;min-width:0;}
.tl-body .ic{color:var(--c);}
.tl-item.livre .tl-body{background:transparent;border:1px dashed var(--line-2);color:var(--ink-3);font-weight:400;}
.tl-item.livre .tl-body .ic{color:var(--ink-3);}
.tl-item.past .tl-body{opacity:.55;}
.now-tag{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--crit);padding:2px 6px;border-radius:5px;margin-left:auto;flex:none;}

/* blocos de estudo */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.prog .track{flex:1;height:8px;border-radius:999px;background:var(--sunken);overflow:hidden;}
.prog .fill{height:100%;border-radius:999px;background:var(--accent);transition:width .3s;}
.prog .n{font:600 12.5px var(--mono);color:var(--ink-2);}
.blk{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s;}
.blk:last-child{margin-bottom:0;}
.blk:hover{border-color:var(--line-2);}
.blk.now{border-color:var(--c);background:color-mix(in srgb,var(--c) 6%,var(--surface));}
.blk.static{cursor:default;}
.blk .b-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.blk .b-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.blk .b-time{font:600 12px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;}
.blk .b-extra{font-size:12.5px;color:var(--ink-2);font-weight:600;}
.blk .b-note{font-size:13.5px;color:var(--ink-2);line-height:1.45;}
.blk.done .b-note,.blk.done .b-extra{text-decoration:line-through;color:var(--ink-3);}
.blk.done .chip{opacity:.55;}

/* checkbox redondo */
.ck{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:0;border-radius:7px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s;}
.ck:hover{border-color:var(--c,var(--accent));}
.ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .15s;}
.ck:checked{background:var(--c,var(--accent));border-color:var(--c,var(--accent));}
.ck:checked::after{transform:rotate(45deg) translate(-1px,-1px) scale(1);}

/* matérias para iniciar sessão */
.subj-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
button.subj{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .15s,background .15s,transform .1s;min-width:0;}
button.subj:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--surface));}
button.subj:active{transform:translateY(1px);}
.s-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none;}
.s-ic .ic{width:19px;height:19px;}
button.subj .s-txt{display:flex;flex-direction:column;min-width:0;}
button.subj .s-name{font-weight:700;font-size:14px;line-height:1.25;}
button.subj .s-tag{font-size:11.5px;color:var(--ink-3);font-weight:500;}
button.subj .s-tag.hot{color:var(--crit);font-weight:700;}
button.subj.wide{grid-column:1 / -1;}
.opts{display:flex;flex-wrap:wrap;gap:6px;}
.opt{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--ink-2);}
.opt:hover{border-color:var(--c,var(--accent));color:var(--ink);}
.opt.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff;font-weight:600;}
.flow-head{display:flex;align-items:center;gap:10px;}
.flow-head b{font-size:15px;}
.flow-q{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:4px;}

.topics{display:flex;flex-direction:column;gap:4px;margin-top:10px;}
.topic{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 8px;border-radius:9px;}
.topic:hover{background:var(--surface-2);}
.topic.done .t{text-decoration:line-through;color:var(--ink-3);}
.add-line{display:flex;gap:8px;margin-top:10px;}
.add-line input{flex:1;min-width:0;}

/* autoavaliação */
.rates{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px;}
.rate{font-size:24px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);filter:grayscale(.6);opacity:.75;transition:all .15s;}
.rate:hover{filter:none;opacity:1;}
.rate.on{filter:none;opacity:1;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));transform:translateY(-2px);}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;}
.seg button{border:none;background:var(--surface);padding:7px 16px;font-weight:600;font-size:13px;color:var(--ink-2);}
.seg button + button{border-left:1px solid var(--line-2);}
.seg button.on-bad{background:var(--crit);color:#fff;}
.seg button.on-good{background:var(--good);color:#fff;}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--crit);background:color-mix(in srgb,var(--crit) 9%,transparent);padding:9px 12px;border-radius:10px;margin-bottom:12px;}

/* campos */
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14px;min-width:0;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);}
textarea{width:100%;resize:vertical;font-family:var(--body);}
input[type=number]{width:84px;}
.form-row{display:flex;gap:8px;flex-wrap:wrap;}
.form-row > *{flex:1 1 140px;}
.form-row .btn{flex:0 0 auto;}
.big-input{width:100%;font-size:15.5px !important;padding:12px 14px !important;}
.check-line{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer;}
.check-line .ck{width:18px;height:18px;border-radius:5px;}
.check-line .ck::after{width:5px;height:9px;}
label.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;}
label.field:last-of-type{border-bottom:none;}
label.field > span{display:flex;align-items:center;gap:9px;}

/* tarefas */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;position:relative;}
.task:last-child{margin-bottom:0;}
.task::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:3px;background:transparent;}
.task.hot{border-color:color-mix(in srgb,var(--crit) 35%,var(--line));background:color-mix(in srgb,var(--crit) 5%,var(--surface));}
.task.hot::before{background:var(--crit);}
.task.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 6%,var(--surface));}
.task.warn::before{background:var(--warn);}
.task .t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.task .t-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.task .t-text{font-size:14.5px;font-weight:600;line-height:1.4;overflow-wrap:anywhere;}
.task.done .t-text{text-decoration:line-through;color:var(--ink-3);font-weight:500;}
.task.failed .t-text{text-decoration:line-through;color:var(--crit);}
.task .t-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);}
.task .t-meta .ic{width:14px;height:14px;}
.task .t-act{display:flex;align-items:center;gap:2px;flex:none;}
.fail-btn{border:1px solid var(--line-2);background:transparent;color:var(--ink-3);font:600 11.5px var(--body);padding:5px 10px;border-radius:999px;white-space:nowrap;}
.fail-btn:hover{color:#fff;background:var(--crit);border-color:var(--crit);}
.task-note{display:block;width:100%;padding:8px 10px;min-height:38px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:9px;color:var(--ink-2);font-size:13px;resize:vertical;}
.task-note::placeholder{color:var(--ink-3);font-style:italic;}
.add-note-btn{display:inline-flex;align-items:center;gap:5px;width:fit-content;background:transparent;border:none;padding:0;color:var(--ink-3);font-size:12.5px;font-weight:600;}
.add-note-btn:hover{color:var(--accent);}
.add-note-btn .ic{width:13px;height:13px;}

/* histórico */
.hist-link{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%;margin-top:16px;padding:14px 16px;border-radius:14px;border:1px dashed var(--line-2);background:transparent;text-align:left;color:var(--ink-2);font-size:13px;}
.hist-link:hover{border-color:var(--accent);background:var(--surface);}
.hl-n{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-size:13px;}
.hl-n b{font:700 16px var(--mono);}
.hl-txt{flex:1;min-width:180px;color:var(--ink-3);}
.hl-chev{color:var(--ink-3);}
.mini-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px;}
.ms{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));display:flex;flex-direction:column;gap:2px;min-width:0;}
.ms b{font:700 22px/1.1 var(--mono);color:var(--c);}
.ms b.ms-subj{display:flex;align-items:center;gap:6px;font:700 17px/1.3 var(--display);}
.ms span{font-size:12px;color:var(--ink-2);line-height:1.3;}
.log-day + .log-day{margin-top:6px;}
.log-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);}
.log-day .log-item:last-child{border-bottom:none;}
.log-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;margin-top:1px;}
.log-ic .ic{width:15px;height:15px;}
.log-ic.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);}
.log-ic.bad{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit);}
.log-ic.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);}
.log-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.log-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.log-text{font-size:14px;font-weight:600;overflow-wrap:anywhere;}
.log-sub{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);}
.log-sub .ic{width:13px;height:13px;}
.log-note{font-style:italic;color:var(--ink-2);}
.log-act{display:flex;align-items:center;gap:2px;flex:none;}

/* placar */
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.gauge-box{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 10px;border-radius:14px;background:var(--surface-2);min-width:0;}
.g-wrap{position:relative;width:100%;max-width:200px;}
.gauge{width:100%;height:auto;display:block;}
.g-num{position:absolute;left:0;right:0;bottom:2px;font:800 34px/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.g-num small{font-size:16px;font-weight:600;margin-left:1px;}
.g-title{font:700 15px var(--display);margin-top:4px;}
.g-level{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:3px 10px;border-radius:999px;}
.g-level .ic{width:13px;height:13px;}
.g-sub{font-size:12.5px;color:var(--ink-2);}
.delta{display:inline-flex;align-items:center;justify-content:center;gap:4px;font:600 11.5px var(--mono);text-align:center;}
.delta .ic{width:12px;height:12px;}
.delta.up{color:var(--good);} .delta.down{color:var(--crit);}
.placar-frase{display:flex;gap:10px;align-items:center;margin-top:12px;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink);font-size:14px;font-weight:500;}
.placar-frase .ic{color:var(--accent);}
.placar h3{margin-top:20px !important;}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;}
.sd{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
.sd-c{width:100%;max-width:34px;aspect-ratio:1;border-radius:8px;display:grid;place-items:center;color:#fff;}
.sd-c .ic{width:55%;height:55%;stroke-width:3;}
.sd.ok .sd-c{background:var(--good);}
.sd.bad .sd-c{background:var(--crit);}
.sd.none .sd-c{background:var(--sunken);}
.sd.hoje .sd-c{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);}
.sd-l{font:500 10px/1.2 var(--mono);color:var(--ink-3);text-align:center;}
.sd.hoje .sd-l{color:var(--ink);font-weight:700;}
.lg-sq{display:inline-block;width:11px;height:11px;border-radius:3px;}
.lg-sq.ok{background:var(--good);} .lg-sq.bad{background:var(--crit);} .lg-sq.none{background:var(--sunken);}
.wk-wrap{overflow-x:auto;}
.wk-chart{width:100%;max-width:640px;height:auto;display:block;}

/* lembretes pessoais na grade */
.gx-form{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--pessoal) 7%,var(--surface-2));border:1px dashed color-mix(in srgb,var(--pessoal) 40%,var(--line));margin-bottom:16px;}
.gx-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink);}
.gx-title .ic{color:var(--pessoal);}
.gx-form .form-row > select{flex:0 1 150px;}
.gx-form .form-row > input[type=time]{flex:0 1 120px;}
.gx-form .form-row > .gx-texto{flex:3 1 220px;}
.th-row{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.th-add{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);padding:0;}
.th-add:hover{color:var(--pessoal);border-color:var(--pessoal);}
.th-add .ic{width:13px;height:13px;}
.slot.extra{display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--pessoal) 10%,var(--surface));border-left-color:var(--pessoal);}
.slot.extra .ex-body{flex:1;min-width:0;display:flex;flex-direction:column;}
.slot.extra .ex-txt{font-weight:600;color:var(--ink);overflow-wrap:break-word;}
.ex-head{display:flex;align-items:center;gap:6px;}
.ex-head b{margin:0 !important;}
.slot.extra.feito .ex-txt{text-decoration:line-through;color:var(--ink-3);font-weight:500;}
.ex-rep{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-3);margin-top:2px;}
.ex-rep .ic{width:11px;height:11px;}
.ex-ck{display:grid;place-items:center;width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--pessoal);background:transparent;color:var(--pessoal);padding:0;}
.ex-ck .ic{width:12px;height:12px;}
.feito .ex-ck{background:var(--pessoal);color:#fff;}
.ex-del{display:grid;place-items:center;width:20px;height:20px;flex:none;border:none;background:transparent;color:var(--ink-3);padding:0;border-radius:6px;}
.ex-del:hover{color:var(--crit);background:var(--surface-2);}
.ex-del .ic{width:12px;height:12px;}
.tl-item.extra .tl-body{background:color-mix(in srgb,var(--pessoal) 10%,transparent);}
.tl-item.extra .tl-dot{border-color:var(--pessoal);}
.tl-item.extra.feito .ex-txt{text-decoration:line-through;color:var(--ink-3);}
.tl-item.extra .ex-txt{flex:1;min-width:0;}
.tl-item.extra .ex-rep{margin:0;}

/* grade no celular: lista por dia */
.week-list{display:none;flex-direction:column;gap:10px;}
.wl-day{border-radius:14px;background:var(--surface-2);padding:10px;}
.wl-day.hoje{background:color-mix(in srgb,var(--accent) 10%,var(--surface-2));box-shadow:inset 0 0 0 1.5px var(--accent);}
.wl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);}
.wl-head em{font-style:normal;color:var(--accent);margin-left:6px;}
.wl-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;}
.wl-items .slot{margin:0;}
@media (max-width:640px){ .tt-wrap{display:none;} .week-list{display:flex;} }

/* código de sincronização */
.sync-code{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sync-code .code{font:700 20px var(--mono);letter-spacing:.14em;background:var(--surface-2);border:1px dashed var(--line-2);padding:8px 14px;border-radius:10px;user-select:all;}

/* semana */
.tt-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px;}
table.tt{border-collapse:separate;border-spacing:6px 0;width:100%;min-width:860px;font-size:12.5px;table-layout:fixed;}
table.tt th{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:4px 8px 8px;}
table.tt td{vertical-align:top;padding:6px;border-radius:12px;background:var(--surface-2);}
table.tt th.today-col{color:var(--accent);}
table.tt td.today-col{background:color-mix(in srgb,var(--accent) 10%,var(--surface-2));box-shadow:inset 0 0 0 1.5px var(--accent);}
.slot{border-radius:9px;padding:7px 9px;margin-bottom:6px;background:var(--surface);border-left:3px solid var(--c);line-height:1.35;}
.slot:last-child{margin-bottom:0;}
.slot b{font:600 11.5px var(--mono);color:var(--ink-2);display:block;margin-bottom:2px;}
.slot.livre{background:transparent;border:1px dashed var(--line-2);color:var(--ink-3);}

/* progresso */
.subject-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.subject-row:last-child{border-bottom:none;}
.subject-row .label{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;min-width:0;}
.subject-row .label .s-ic{width:30px;height:30px;border-radius:9px;}
.subject-row .label .s-ic .ic{width:16px;height:16px;}
.bar-track{position:relative;height:12px;border-radius:999px;background:var(--sunken);overflow:visible;}
.bar-fill{height:100%;border-radius:999px;background:var(--c);}
.bar-mark{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--ink-2);opacity:.55;}
.subject-row .stat{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.subject-row .stat .mono{font-size:13px;color:var(--ink-2);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{display:inline-block;width:2px;height:12px;background:var(--ink-2);opacity:.55;border-radius:2px;}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;}
.heat-head,.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:330px;}
.heat-head{font:600 10.5px var(--mono);color:var(--ink-3);text-align:center;margin-bottom:5px;}
.heat-cell{aspect-ratio:1;border-radius:6px;max-width:100%;}
.heat-cell.blank{background:transparent;}
.heat-cell.today{box-shadow:0 0 0 2px var(--ink);}
.h0{background:var(--heat-0);} .h1{background:var(--heat-1);} .h2{background:var(--heat-2);} .h3{background:var(--heat-3);} .h4{background:var(--heat-4);}
.heat-scale{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);margin-top:10px;}
.heat-scale .heat-cell{width:12px;height:12px;aspect-ratio:auto;border-radius:3px;}
.stat-pair{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-2);}
.stat-pair b{font:700 18px var(--mono);color:var(--ink);margin-right:4px;}
.hist-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.hist-item:last-child{border-bottom:none;}
.hist-item .meta{flex:1;min-width:0;}
.hist-item .l1{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.hist-item .l2{color:var(--ink-3);font-size:12.5px;}
.hist-item .dur{font:600 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;}
.flag{display:inline-flex;align-items:center;gap:4px;color:var(--warn);font-size:11.5px;font-weight:600;}
.flag .ic{width:12px;height:12px;}

/* janelas e avisos */
.modal-overlay{position:fixed;inset:0;background:rgba(4,10,8,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:390px;width:100%;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);}
.modal .m-ic{width:56px;height:56px;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);}
.modal .m-ic .ic{width:28px;height:28px;}
.modal h2{margin:0;font:700 19px/1.25 var(--display);letter-spacing:-.02em;}
.modal .clock{display:block;margin:12px 0;font-size:34px;color:var(--ink);}
.modal .row{justify-content:center;}
.modal button.primary{background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-weight:600;}
.modal button.danger{background:var(--crit);border-color:var(--crit);color:#fff;}
.modal button.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);padding:10px 16px;border-radius:10px;font-weight:600;}
.aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;z-index:80;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3);}
textarea.importar{min-height:90px;font:12.5px var(--mono);}

/* ---------- telas menores ---------- */
@media (max-width:860px){
  .hoje-grid,.grid2{grid-template-columns:minmax(0,1fr);}
  .vitals{grid-template-columns:repeat(3,minmax(0,1fr));}
  .vital.c-next{grid-column:1 / -1;}
  .hoje-grid{display:flex;flex-direction:column;gap:16px;}
  .hoje-grid > .stack{display:contents;}
  .o-pend{order:-1;}
}
@media (max-width:640px){
  .dock nav.tabs{display:none;}
  .dock{box-shadow:none;border-bottom:none;}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -18px rgba(0,0,0,.5);}
  nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--ink-3);font-size:11px;font-weight:600;padding:5px 0;position:relative;}
  nav.bottom button .ic{width:22px;height:22px;}
  nav.bottom button.active{color:var(--accent);}
  nav.bottom .dotc{position:absolute;top:1px;left:calc(50% + 6px);font:700 10px var(--mono);background:var(--crit);color:#fff;border-radius:999px;padding:0 5px;line-height:16px;}
  .wrap{padding-bottom:110px;}

/* ---------- state ---------- */

function defaultState(){
  return {

      hm:      {name:'Habilidades Médicas', short:'HM', slot:1, weeklyTargetMin:360, priority:1,
                note:'Cobrança forte de decoreba ("rodapé de livro"), principalmente com a Profª Dora.'},
      tutoria: {name:'Tutoria', short:'Tutoria', slot:2, weeklyTargetMin:300, priority:1,

      piesf:   {name:'PIESF', short:'PIESF', slot:3, weeklyTargetMin:180, priority:2, note:''},

    },

    active: null,

    localAt: 0,

  };
}

let state = loadState();
let pendingNewSession = null; // transient, not persisted
let openTaskNotes = new Set(); // transient, not persisted
let titleFlashInterval = null;
let titleFlashOn = false;

function loadState(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){}
  if(raw && raw.localAt===undefined) raw.localAt = 0;
  const d = defaultState();
  if(!raw) return d;
  const merged = Object.assign({}, d, raw);
  merged.subjects = Object.assign({}, d.subjects, raw.subjects);
  for(const k in merged.subjects){
    merged.subjects[k] = Object.assign({}, d.subjects[k]||{}, merged.subjects[k]);
  }
  merged.settings = Object.assign({}, d.settings, raw.settings);
  merged.ui = Object.assign({}, d.ui, raw.ui);
  merged.sessions = raw.sessions || [];
  merged.dailyReviews = raw.dailyReviews || {};
  merged.tasks = raw.tasks || [];
  merged.blocoChecks = raw.blocoChecks || {};
  merged.historico = Array.isArray(raw.historico) ? raw.historico : [];
  merged.gradeExtras = Array.isArray(raw.gradeExtras) ? raw.gradeExtras : [];
  merged.sync = Object.assign({code:null}, raw.sync);
  return merged;
}

function saveState(){
  if(!applyingRemote) state.localAt = Date.now();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  if(!applyingRemote) agendarSync();
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------- sincronização entre aparelhos (Firebase, pelo código) ---------- */

const SYNC_FIELDS = ['subjects','settings','sessions','dailyReviews','tasks','blocoChecks','historico','gradeExtras'];
let applyingRemote = false;
let syncStatus = {txt:'sem sincronização', cls:'erro'};

function getDeviceId(){
  let id = null;
  try{ id = localStorage.getItem('plantaoDeviceId'); }catch(e){}
  if(!id){ id = uid()+uid(); try{ localStorage.setItem('plantaoDeviceId', id); }catch(e){} }
  return id;
}
const DEVICE_ID = getDeviceId();

function syncPayload(){
  const p = {};
  SYNC_FIELDS.forEach(f=>{ p[f] = state[f]; });
  return JSON.parse(JSON.stringify(p));
}
function setSync(txt, cls){
  syncStatus = {txt, cls:cls||''};
  const el = document.getElementById('syncPill');
  if(el){ el.textContent = txt; el.className = 'sync-pill' + (cls?' '+cls:''); }
}
function temCodigo(){ return !!(state.sync && state.sync.code); }
function agendarSync(){
  if(!temCodigo()) return;
  if(!window.__sync){ setSync('conectando…','enviando'); window.addEventListener('sync-ready', agendarSync, {once:true}); return; }
  setSync('salvando…','enviando');
  window.__sync.push(state.sync.code, DEVICE_ID, syncPayload(), state.localAt || Date.now(), ok=>{
    setSync(ok ? 'sincronizado' : 'sem internet · salvo aqui', ok ? '' : 'erro');
  });
}
function handleRemoteSync(data, deOutro){
  if(!data){ if(temCodigo()) agendarSync(); return; }   // código novo: sobe o que tem aqui
  if(!deOutro){ setSync('sincronizado',''); return; }
  const remoto = data.updatedAt || 0, local = state.localAt || 0;
  if(remoto < local){ agendarSync(); return; }         // este aparelho está mais novo: manda
  if(remoto === local){ setSync('sincronizado',''); return; }
  applyingRemote = true;
  SYNC_FIELDS.forEach(f=>{ if(data[f]!==undefined) state[f] = data[f]; });
  state.localAt = remoto;
  const migrou = migrarHistorico();
  saveState();
  render();
  applyingRemote = false;
  if(migrou) saveState();
  setSync('atualizado de outro aparelho','');
}
function assinar(){
  if(!temCodigo()){ setSync('sem sincronização','erro'); return; }
  if(!window.__sync){ setSync('conectando…','enviando'); window.addEventListener('sync-ready', assinar, {once:true}); return; }
  window.__sync.subscribe(state.sync.code, DEVICE_ID, handleRemoteSync, ok=>{ if(!ok) setSync('sem internet · salvo aqui','erro'); });
}
function genSyncCode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<10;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function createSync(){
  state.sync = {code: genSyncCode()};
  saveState();
  assinar();
  render();
  aviso('Código criado. Cole ele nos outros aparelhos, em Ajustes → Sincronização.');
}
async function joinSync(codeRaw){
  const code = String(codeRaw||'').trim().toUpperCase().replace(/\s+/g,'');
  if(code.length < 8){ aviso('Código inválido: cole o código completo que aparece no outro aparelho.'); return; }
  if(!window.__sync){ aviso('A sincronização ainda está carregando. Tenta de novo em alguns segundos.'); return; }
  if(!(await confirmar('Entrar no código '+code+'? Os dados deste aparelho serão trocados pelos que estão na nuvem com esse código.'))) return;
  setSync('conectando…','enviando');
  const r = await window.__sync.join(code);
  if(!r.ok){ aviso('Não consegui conectar. Confira a internet e tente de novo.'); setSync('sem internet · salvo aqui','erro'); return; }
  applyingRemote = true;
  state.sync = {code};
  if(r.data){
    SYNC_FIELDS.forEach(f=>{ if(r.data[f]!==undefined) state[f] = r.data[f]; });
    state.localAt = r.data.updatedAt || Date.now();
    migrarHistorico();
  }
  saveState();
  applyingRemote = false;
  if(!r.data) agendarSync();
  assinar();
  render();
  aviso(r.data ? 'Pronto: este aparelho está sincronizado.' : 'Código novo: os dados deste aparelho foram pra nuvem.');
}
async function stopSync(){
  if(!(await confirmar('Desligar a sincronização neste aparelho? Os dados na nuvem continuam lá; só este aparelho para de sincronizar.'))) return;
  if(window.__sync) window.__sync.unsubscribe();
  state.sync = {code:null};
  saveState();
  setSync('sem sincronização','erro');
  render();
}
function copiarCodigo(){
  const code = state.sync && state.sync.code;
  if(!code) return;
  const falha = ()=>aviso('Não deu pra copiar sozinho. Selecione o código e copie.');
  try{ navigator.clipboard.writeText(code).then(()=>aviso('Código copiado!'), falha); }catch(e){ falha(); }
}

/* copiar todos os dados (pra levar pro outro Plantão) */
function copiarDados(){
  const txt = JSON.stringify({plantaoExport:true, versao:2, exportadoEm:Date.now(), dados:syncPayload()});
  const el = document.getElementById('exportOut');
  if(el){ el.value = txt; el.hidden = false; }
  const ok = ()=>aviso('Dados copiados! Agora cole no outro Plantão, em Ajustes → Importar.');
  const falha = ()=>{ if(el){ el.focus(); el.select(); } aviso('Não deu pra copiar sozinho: o texto está selecionado, copie com Ctrl+C.'); };
  try{ navigator.clipboard.writeText(txt).then(ok, falha); }catch(e){ falha(); }
}
/* importar os dados do Plantão antigo (arquivo no computador) */
async function importarDados(){
  const el = document.getElementById('importInput');
  const txt = el ? el.value.trim() : '';
  if(!txt){ aviso('Cole primeiro o texto copiado do outro Plantão.'); return; }
  let d;
  try{ d = JSON.parse(txt); }catch(e){ aviso('Esse texto não é o que o Plantão copia. Copie de novo pelo botão Copiar meus dados.'); return; }
  if(d && d.plantaoExport) d = d.dados;
  if(!d || typeof d!=='object' || !Array.isArray(d.tasks)){ aviso('Não achei tarefas nesse texto. Copie de novo pelo botão Copiar meus dados.'); return; }
  if(!(await confirmar('Trocar os dados daqui pelos que você colou? '+d.tasks.length+' tarefa(s) pendente(s) e '+((d.historico||[]).length)+' registro(s) de histórico vão entrar.'))) return;
  const idsChat = new Set(d.tasks.map(t=>t.id));
  const doChat = state.tasks.filter(t=>String(t.id).startsWith('chat-') && !idsChat.has(t.id));
  SYNC_FIELDS.forEach(f=>{ if(d[f]!==undefined) state[f] = d[f]; });
  state.tasks = doChat.concat(state.tasks);
  migrarHistorico();
  saveState(); render();
  aviso('Pronto: '+state.tasks.length+' tarefas e '+(state.sessions||[]).length+' sessões trazidas.');
}

/* avisos e confirmações dentro da página (o Claude não mostra alert/confirm) */
let avisoTimer = null;
function aviso(msg){
  let el = document.getElementById('avisoToast');
  if(!el){ el = document.createElement('div'); el.id='avisoToast'; el.className='aviso'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(()=>{ el.hidden = true; }, 4200);
}
function confirmar(msg){
  return new Promise(resolve=>{
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div style="font-size:15px;line-height:1.45;margin-bottom:16px;"></div>' +
      '<div class="row" style="justify-content:center;"><button class="primary danger" data-r="1">Confirmar</button><button class="ghost" data-r="0">Cancelar</button></div></div>';
    ov.querySelector('.modal > div').textContent = msg;
    ov.addEventListener('click', e=>{
      const b = e.target.closest('[data-r]');
      if(!b && e.target!==ov) return;
      ov.remove(); resolve(!!(b && b.dataset.r==='1'));
    });
    document.body.appendChild(ov);
    ov.querySelector('[data-r="1"]').focus();
  });
}

/* ---------- time helpers ---------- */

function fmtClock(ms){
  let s = Math.floor(ms/1000);
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  return (h>0 ? String(h).padStart(2,'0')+':' : '') + String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function fmtDuration(ms){
  const totalMin = Math.round(ms/60000);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  if(h<=0) return m+'min';
  if(m===0) return h+'h';
  return h+'h'+String(m).padStart(2,'0');
}
function activeElapsedMs(active){
  if(!active) return 0;
  let sum = 0;
  for(const seg of active.segments){ sum += (seg.end||Date.now()) - seg.start; }
  return sum;
}
function localDateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayKey(){
  const d = new Date();
  const idx = d.getDay(); // 0 sun .. 6 sat
  const map = {1:'seg',2:'ter',3:'qua',4:'qui',5:'sex'};
  return map[idx] || null;
}
function todayKeyAny(){
  const d = new Date();
  const idx = d.getDay(); // 0 sun .. 6 sat
  const map = {0:'dom',1:'seg',2:'ter',3:'qua',4:'qui',5:'sex',6:'sab'};
  return map[idx];
}
function weekStart(d=new Date()){
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day===0 ? -6 : 1-day);
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()+diff);
  return dt;
}
function inCurrentWeek(ts){
  const ws = weekStart().getTime();
  return ts>=ws && ts<ws+7*24*3600*1000;
}
function weekdayProgressFraction(){
  const day = new Date().getDay();
  const idx = day===0 ? 7 : day;
  return Math.min(idx,5)/5;
}

/* ---------- derived stats ---------- */

function weeklyMinutesBySubject(){
  const res = {};
  for(const k in state.subjects) res[k]=0;
  for(const s of state.sessions){
    if(inCurrentWeek(s.endedAt)) res[s.subject] = (res[s.subject]||0) + s.durationMs/60000;
  }
  if(state.active){
    res[state.active.subject] = (res[state.active.subject]||0) + activeElapsedMs(state.active)/60000;
  }
  return res;
}
function dailyTotals(){
  const map = {};
  for(const s of state.sessions){
    const key = localDateKey(new Date(s.endedAt));
    map[key] = (map[key]||0) + s.durationMs;
  }
  if(state.active){
    const key = localDateKey(new Date());
    map[key] = (map[key]||0) + activeElapsedMs(state.active);
  }
  return map;
}
function computeStreak(){
  const totals = dailyTotals();
  const MIN_MS = 15*60000; // a day only "counts" once real focus time was logged
  let cursor = new Date();
  if(!(totals[localDateKey(cursor)] >= MIN_MS)) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(true){
    const key = localDateKey(cursor);
    if(totals[key] >= MIN_MS){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}

/* ---------- session lifecycle ---------- */

function startSession(subject, subtopic, mode){
  if(state.active) return;
  state.active = {
    id: uid(), subject, subtopic: subtopic||null, mode: mode||null,
    segments: [{start:Date.now(), end:null}],
    lastCheckInTs: Date.now(), status:'running', topics:[]
  };
  state.pendingCheckIn = null;
  pendingNewSession = null;
  saveState(); render();

function pauseSession(){
  if(!state.active || state.active.status!=='running') return;
  const segs = state.active.segments;
  segs[segs.length-1].end = Date.now();
  state.active.status = 'paused';
  state.pendingCheckIn = null;
  stopTitleFlash();

function resumeSession(){
  if(!state.active || state.active.status!=='paused') return;
  state.active.segments.push({start:Date.now(), end:null});
  state.active.status = 'running';
  state.active.lastCheckInTs = Date.now();
  saveState(); render();
}
function finishSession(endTs, extra){
  extra = extra || {};
  if(!state.active) return;
  const segs = state.active.segments.map(s=>Object.assign({}, s));
  if(segs.length && segs[segs.length-1].end===null) segs[segs.length-1].end = endTs;
  const durationMs = Math.max(0, segs.reduce((a,s)=>a+((s.end||endTs)-s.start),0));
  const record = {
    id: state.active.id, subject: state.active.subject, subtopic: state.active.subtopic, mode: state.active.mode,
    topics: state.active.topics, durationMs,
    startedAt: segs[0].start, endedAt: endTs,
    flagged: !!extra.flagged, note: extra.note||''
  };
  state.sessions.unshift(record);
  state.active = null;
  state.pendingCheckIn = null;
  stopTitleFlash();
  saveState(); render();
}

/* ---------- pending tasks ---------- */

function addTask(text, subject, dueDate, dueTime, recurWeekday){
  const t = (text||'').trim();
  if(!t) return;
  state.tasks.unshift({id:uid(), text:t, subject: subject||null, dueDate: dueDate||null, dueTime: (dueDate&&dueTime)||null, done:false, failed:false, failedAt:null, notes:'', recurWeekday: recurWeekday||null, createdAt:Date.now()});
  saveState(); render();
}
function weekdayDateStr(weekdayKey, fromDate, includeSameDay){
  const targetIdx = {dom:0,seg:1,ter:2,qua:3,qui:4,sex:5,sab:6}[weekdayKey];
  const d = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
  let diff = (targetIdx - d.getDay() + 7) % 7;
  if(diff===0 && !includeSameDay) diff = 7;
  d.setDate(d.getDate()+diff);
  const pad = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function onRecurToggle(checked){
  const dueEl = document.getElementById('taskDueInput');
  const dayEl = document.getElementById('taskRecurWeekday');
  if(dueEl) dueEl.style.display = checked ? 'none' : '';
  if(dayEl) dayEl.style.display = checked ? '' : 'none';
}
function cycleRecurringTasks(){
  let changed = false;
  const now = new Date();
  state.tasks.forEach(t=>{
    if(!t.recurWeekday || !t.dueDate || !(t.done || t.failed)) return;
    if(dueDateTime(t).getTime() > now.getTime()) return;
    t.dueDate = weekdayDateStr(t.recurWeekday, now, false);
    t.done = false;
    t.failed = false;
    t.failedAt = null;
    t.notes = '';
    t.notifiedThresholds = [];
    changed = true;
  });
  if(changed) saveState();
}
function setTaskNote(id, text){

  const textEl = document.getElementById('taskTextInput');
  const subjEl = document.getElementById('taskSubjectSelect');
  const dueEl = document.getElementById('taskDueInput');
  const dueTimeEl = document.getElementById('taskDueTimeInput');
  const recurEl = document.getElementById('taskRecurCheckbox');
  const recurDayEl = document.getElementById('taskRecurWeekday');
  if(!textEl || !textEl.value.trim()) return;
  if(recurEl && recurEl.checked){
    const weekday = recurDayEl.value;
    const dueDate = weekdayDateStr(weekday, new Date(), true);
    addTask(textEl.value, subjEl.value||null, dueDate, dueTimeEl.value||null, weekday);
  } else {
    addTask(textEl.value, subjEl.value||null, dueEl.value||null, dueTimeEl.value||null, null);
  }
}
/* ---------- histórico: concluídas e não cumpridas saem da lista ---------- */
function snapTask(t){ return JSON.parse(JSON.stringify(t)); }
function histEntry(t, kind, day, at){
  return {id:uid(), kind, taskId:t.id, text:t.text, subject:t.subject||null, dueDate:t.dueDate||null, dueTime:t.dueTime||null,
    notes:t.notes||'', recur:t.recurWeekday||null, at:at||Date.now(), day:day||todayFullKey(), snap: t.recurWeekday ? null : snapTask(t)};
}
function advanceRecurring(t){
  let next = weekdayDateStr(t.recurWeekday, t.dueDate ? new Date(t.dueDate+'T12:00:00') : new Date(), false);
  let guard = 0;
  while(new Date(next+'T23:59:00') < new Date() && guard++ < 60) next = weekdayDateStr(t.recurWeekday, new Date(next+'T12:00:00'), false);
  t.dueDate = next;
  t.done = false; t.failed = false; t.failedAt = null; t.notes = ''; t.notifiedThresholds = [];
}
function closeTask(id, kind){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  state.historico.unshift(histEntry(t, kind));
  if(kind==='failed'){
    const rev = ensureTodayReview();
    rev.procrastinated = true; rev.updatedAt = Date.now();
  }
  if(t.recurWeekday) advanceRecurring(t);
  else state.tasks = state.tasks.filter(x=>x.id!==id);
  openTaskNotes.delete(id);
  saveState(); render();
  aviso(kind==='done' ? 'Concluída! Foi pro histórico na aba Progresso.' : 'Anotado em "Onde procrastinei", na aba Progresso.');
}
function toggleTaskDone(id){ closeTask(id, 'done'); }
function toggleTaskFailed(id){ closeTask(id, 'failed'); }
function desfazerHist(id){
  const h = state.historico.find(x=>x.id===id);
  if(!h) return;
  state.historico = state.historico.filter(x=>x.id!==id);
  let volta = false;
  if(h.snap && !state.tasks.some(t=>t.id===h.snap.id)){
    const t = snapTask(h.snap);
    t.done = false; t.failed = false; t.failedAt = null;
    state.tasks.unshift(t); volta = true;
  }
  saveState(); render();
  aviso(volta ? 'A tarefa voltou pras pendentes.' : 'Registro desfeito.');
}
async function apagarHist(id){
  if(!(await confirmar('Apagar este registro do histórico?'))) return;
  state.historico = state.historico.filter(x=>x.id!==id);
  saveState(); render();

/* tarefas fechadas no formato antigo (ficavam na lista) vão pro histórico */
function migrarHistorico(){
  if(!Array.isArray(state.historico)) state.historico = [];
  let changed = false;
  if(state.settings && !state.settings.graceV2){   // novo padrão: encerra se não responder em 5 min
    state.settings.graceMinutes = Math.min(Number(state.settings.graceMinutes)||5, 5);
    state.settings.graceV2 = true;
    changed = true;
  }
  state.tasks.slice().forEach(t=>{
    if(!(t.done || t.failed)) return;
    const kind = t.failed ? 'failed' : 'done';
    const day = (kind==='failed' && t.failedAt) ? t.failedAt : localDateKey(new Date(t.doneAt || t.createdAt || Date.now()));
    state.historico.push(histEntry(t, kind, day, new Date(day+'T12:00:00').getTime()));
    if(t.recurWeekday) advanceRecurring(t);
    else state.tasks = state.tasks.filter(x=>x.id!==t.id);
    changed = true;
  });
  if(changed) state.historico.sort((a,b)=>b.at-a.at);
  return changed;
}
function failedOn(dayKey){ return state.historico.filter(h=>h.kind==='failed' && h.day===dayKey).length; }

async function deleteTask(id){
  if(!(await confirmar('Excluir esta tarefa?'))) return;
  state.tasks = state.tasks.filter(x=>x.id!==id);
  saveState(); render();

function dueDateTime(t){
  if(!t.dueDate) return null;
  return new Date(t.dueDate+'T'+(t.dueTime||'23:59')+':00');
}
function sortTasksByDue(a,b){
  const da = dueDateTime(a), db = dueDateTime(b);
  if(da && db) return da-db;
  if(da) return -1;
  if(db) return 1;
  return b.createdAt - a.createdAt;
}
function computeDueInfo(t){
  const dt = dueDateTime(t);
  if(!dt) return null;
  const diffMs = dt - new Date();
  const overdue = diffMs < 0;
  const absMs = Math.abs(diffMs);
  const totalMin = Math.floor(absMs/60000);
  const days = Math.floor(totalMin/1440);
  const hours = Math.floor((totalMin%1440)/60);
  const mins = totalMin%60;
  let txt;
  if(days>0) txt = days+'d '+hours+'h';
  else if(hours>0) txt = hours+'h '+mins+'min';
  else txt = mins+'min';
  let cls = 'badge';
  if(overdue) cls = 'badge hot';
  else if(absMs<=3*3600*1000) cls = 'badge hot';
  else if(absMs<=24*3600*1000) cls = 'badge warn';
  const label = overdue ? ('atrasada há '+txt) : ('faltam '+txt);
  return {cls, label};
}
function dueBadgeHtml(t){
  const info = computeDueInfo(t);
  if(!info) return '';
  return '<span class="'+info.cls+'" data-due-task="'+t.id+'">'+info.label+'</span>';
}
function updateTaskCountdowns(){
  document.querySelectorAll('[data-due-task]').forEach(el=>{
    const t = state.tasks.find(x=>x.id===el.getAttribute('data-due-task'));
    if(!t) return;
    const info = computeDueInfo(t);
    if(!info) return;
    el.className = info.cls;
    el.textContent = info.label;
  });
}

/* ---------- check-in / notification engine ---------- */

function beep(){
  if(!state.settings.soundOn) return;
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.28].forEach(delay=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      const t0 = ctx.currentTime+delay;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.24);
      o.start(t0); o.stop(t0+0.26);
    });
  }catch(e){}
}
function notifyOS(title, body, tag){
  if(typeof Notification==='undefined') return;
  if(Notification.permission!=='granted') return;
  try{
    const n = new Notification(title, {body, tag: tag||'checkin', renotify:true});
    n.onclick = () => { window.focus(); n.close(); };
  }catch(e){}
}

/* ---------- task deadline reminders ---------- */

const DEADLINE_THRESHOLDS = [1440, 180, 30, 0]; // minutos antes do prazo (0 = venceu)
function thresholdLabel(min){
  if(min===0) return 'Prazo vencido';
  if(min===30) return 'Vence em 30 minutos';
  if(min===180) return 'Vence em 3 horas';
  if(min===1440) return 'Vence em 24 horas';
  return 'Prazo chegando';
}
function checkTaskDeadlines(){
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  let changed = false;
  state.tasks.forEach(t=>{
    if(t.done || t.failed || !t.dueDate) return;
    const diffMin = (dueDateTime(t) - Date.now())/60000;
    t.notifiedThresholds = t.notifiedThresholds || [];
    const newlyCrossed = DEADLINE_THRESHOLDS.filter(th => diffMin<=th && !t.notifiedThresholds.includes(th));
    if(newlyCrossed.length){
      const mostUrgent = Math.min(...newlyCrossed);
      const subj = t.subject && state.subjects[t.subject] ? state.subjects[t.subject].name : 'Geral';
      notifyOS(thresholdLabel(mostUrgent), subj+' — '+t.text, 'task-'+t.id+'-'+mostUrgent);
      t.notifiedThresholds.push(...newlyCrossed);
      changed = true;
    }
  });
  if(changed) saveState();
}
function startTitleFlash(){
  if(titleFlashInterval) return;
  titleFlashInterval = setInterval(()=>{
    titleFlashOn = !titleFlashOn;
    document.title = titleFlashOn ? '⏰ Ainda estudando?' : ORIGINAL_TITLE;
  }, 1000);
}
function stopTitleFlash(){
  if(titleFlashInterval){ clearInterval(titleFlashInterval); titleFlashInterval=null; }
  document.title = ORIGINAL_TITLE;
}
function issueCheckIn(){
  state.pendingCheckIn = {issuedAt: Date.now()};
  saveState();
  beep();
  const subj = state.subjects[state.active.subject];
  notifyOS('Ainda estudando?', subj.name + ' — ' + fmtDuration(activeElapsedMs(state.active)) + ' até agora. Toque pra confirmar.');
  startTitleFlash();
  render();
}
function respondCheckIn(yes){
  if(!state.pendingCheckIn) return;
  if(yes){
    state.active.lastCheckInTs = Date.now();
    state.pendingCheckIn = null;
    stopTitleFlash();
    saveState(); render();
  } else {
    finishSession(Date.now(), {});
  }
}
function heartbeat(){
  if(!state.active || state.active.status!=='running') return;
  const now = Date.now();
  const checkInMs = state.settings.checkInMinutes*60000, graceMs = state.settings.graceMinutes*60000;
  if(!state.pendingCheckIn && now - state.active.lastCheckInTs >= checkInMs + graceMs){
    // o aparelho dormiu/ficou parado e a pergunta nem chegou a aparecer: encerra no último momento confirmado
    finishSession(state.active.lastCheckInTs, {flagged:true, note:'Encerrada automaticamente — o Plantão ficou parado sem resposta.'});
    return;
  }
  if(state.pendingCheckIn){
    if(now - state.pendingCheckIn.issuedAt >= graceMs){
      const cutoff = state.pendingCheckIn.issuedAt;
      finishSession(cutoff, {flagged:true, note:'Encerrada automaticamente — sem resposta ao check-in.'});
    }
  } else {
    if(now - state.active.lastCheckInTs >= state.settings.checkInMinutes*60000){
      issueCheckIn();
    }
  }
}

function hm2min(s){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(s||'').trim()); return m ? (+m[1])*60 + (+m[2]) : null; }
function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function rangeState(start, end){
  const a = hm2min(start), b = hm2min(end);
  if(a===null || b===null) return '';
  const n = nowMin();
  if(n>=a && n<b) return 'now';
  if(n>=b) return 'past';
  return '';
}

function renderPulseTrace(){
  const totals = dailyTotals();
  const days = [];
  const today = new Date();
  for(let i=6;i>=0;i--){
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate()-i);
    days.push(totals[localDateKey(d)] || 0);
  }
  const max = Math.max(60*60000, ...days);
  const W=700, H=46, pad=6, seg=(W-2*pad)/7, base=H-10;
  let d = 'M 0 '+base+' L '+pad+' '+base;
  days.forEach((ms,i)=>{
    const x = pad + i*seg;
    const frac = Math.min(1, ms/max);
    if(frac<=0.02){ d += ' L '+(x+seg)+' '+base; return; }
    const amp = 6 + frac*(base-8);
    const c = x + seg*0.5;
    d += ' L '+(c-seg*0.30)+' '+base;
    d += ' L '+(c-seg*0.12)+' '+(base+amp*0.18);
    d += ' L '+c+' '+(base-amp);
    d += ' L '+(c+seg*0.12)+' '+(base+amp*0.22);
    d += ' L '+(c+seg*0.30)+' '+base;
    d += ' L '+(x+seg)+' '+base;
  });
  d += ' L '+W+' '+base;
  const lastX = pad + 6*seg + seg*0.5;
  const labels = [];
  const ini = ['D','S','T','Q','Q','S','S'];
  for(let i=6;i>=0;i--){
    const dd = new Date(today.getFullYear(), today.getMonth(), today.getDate()-i);
    labels.push('<span'+(i===0?' class="hoje"':'')+'>'+(i===0?'HOJE':ini[dd.getDay()])+'</span>');
  }
  return '<div class="trace-box">' +
    '<div class="v-lbl">'+ic('activity')+'Traçado · últimos 7 dias de estudo</div>' +
    '<svg class="trace-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="'+d+'" fill="none" stroke="var(--trace)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="'+lastX+'" cy="'+base+'" r="3.5" fill="var(--trace)"/>' +
    '</svg>' +
    '<div class="trace-days">'+labels.join('')+'</div>' +
  '</div>';
}

function renderTaskItem(t){
  const subj = t.subject && state.subjects[t.subject] ? state.subjects[t.subject] : null;
  const color = subj ? subjColor(t.subject) : 'var(--ink-3)';
  const prazoTxt = t.dueDate ? (new Date(t.dueDate+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'})+(t.dueTime?' · '+t.dueTime:'')) : '';
  const info = (!t.done && !t.failed) ? computeDueInfo(t) : null;
  const triage = info && info.cls==='badge hot' ? ' hot' : (info && info.cls==='badge warn' ? ' warn' : '');
  const hasNote = !!(t.notes && t.notes.trim());
  const noteOpen = hasNote || openTaskNotes.has(t.id);
  const noteHtml = noteOpen
    ? '<textarea class="task-note" data-task-id="'+t.id+'" placeholder="Observação: o que já fez, o que falta…" onblur="setTaskNote(\''+t.id+'\', this.value)">'+escapeHtml(t.notes||'')+'</textarea>'
    : '<button class="add-note-btn" onclick="toggleTaskNoteOpen(\''+t.id+'\')">'+ic('pencil')+'Observação</button>';
  const statusCls = t.done ? ' done' : (t.failed ? ' failed' : '');
  const meta = [];
  if(t.dueDate) meta.push('<span class="row" style="gap:5px">'+ic('calendar')+prazoTxt+'</span>');
  if(t.recurWeekday) meta.push('<span class="row" style="gap:5px">'+ic('repeat')+'toda '+DAY_NAMES[t.recurWeekday].toLowerCase()+'</span>');
  if(t.dueDate && !t.done && !t.failed) meta.push(dueBadgeHtml(t));
  if(t.failed) meta.push('<span class="badge hot">'+ic('alert')+'não cumprida</span>');
  const failBtn = (!t.done && !t.failed)
    ? '<button class="fail-btn" onclick="toggleTaskFailed(\''+t.id+'\')" title="Marcar que não consegui cumprir">Não cumpri</button>'
    : (t.failed ? '<button class="fail-btn" onclick="toggleTaskFailed(\''+t.id+'\')">Desfazer</button>' : '');
  return '<div class="task'+triage+statusCls+'" style="--c:'+color+'">' +
    '<input type="checkbox" class="ck" aria-label="Concluir tarefa" '+(t.done?'checked':'')+' onchange="toggleTaskDone(\''+t.id+'\')">' +
    '<div class="t-main">' +
      '<div class="t-top">'+chip(t.subject)+'<span class="t-text">'+escapeHtml(t.text)+'</span></div>' +
      (meta.length ? '<div class="t-meta">'+meta.join('')+'</div>' : '') +
      noteHtml +
    '</div>' +
    '<div class="t-act">' + failBtn +
      '<button class="icon-only" onclick="deleteTask(\''+t.id+'\')" title="Excluir tarefa" aria-label="Excluir tarefa">'+ic('trash')+'</button>' +
    '</div>' +
  '</div>';
}

  '</button>';
  return html;

  const itens = [];
  (dk ? (SCHEDULE[dk]||[]) : []).forEach(slot=>{
    const livre = slot.type==='livre';
    const sk = livre ? null : slotSubject(slot.label);
    const color = livre ? 'var(--line-2)' : (sk ? subjColor(sk) : 'var(--accent)');
    const st = rangeState(slot.start, slot.end);
    const hasEnd = slot.end && slot.end!=='—';
    itens.push({t: hm2min(slot.start) ?? -1, html:'<div class="tl-item'+(livre?' livre':'')+(st?' '+st:'')+'" style="--c:'+color+'">' +
      '<div class="tl-time">'+slot.start+(hasEnd?'<span>'+slot.end+'</span>':'')+'</div>' +
      '<div class="tl-rail"><span class="tl-dot"></span></div>' +
      '<div class="tl-body">'+ic(livre?'coffee':(sk?SUBJ_ICON[sk]:'book'))+'<span>'+slotLabel(slot)+'</span>'+(st==='now'?'<span class="now-tag">agora</span>':'')+'</div>' +
    '</div>'});
  });
  extrasDoDia(dia).forEach(x=>{
    const feito = extraFeito(x);
    itens.push({t: x.hora ? hm2min(x.hora) : 2000, html:'<div class="tl-item extra'+(feito?' feito':'')+'" style="--c:var(--pessoal)">' +
      '<div class="tl-time">'+(x.hora || '<span>sem hora</span>')+'</div>' +
      '<div class="tl-rail"><span class="tl-dot"></span></div>' +
      '<div class="tl-body"><button class="ex-ck" onclick="toggleExtra(\''+x.id+'\')" aria-label="Marcar como feito">'+ic(feito?'check':'pin')+'</button><span class="ex-txt">'+escapeHtml(x.texto)+'</span>'+(x.semana?'':'<span class="ex-rep" title="Toda semana">'+ic('repeat')+'</span>')+'</div>' +
    '</div>'});
  });
  itens.sort((a,b)=>a.t-b.t);
  let html = '<div class="card">' + cardHead('calendar','Agenda de hoje','var(--s1)', '<button class="btn sm ghost" onclick="irParaGrade(\''+dia+'\')">'+ic('plus')+'Lembrete</button>');
  if(!itens.length){
    html += '<div class="empty">'+ic('coffee')+'Sem aula hoje. Bom dia pra colocar Tutoria, HM ou as demais matérias em dia.</div></div>';
    return html;
  }
  html += '<div class="tl">' + itens.map(x=>x.html).join('') + '</div></div>';
  return html;
}

/* ---------- lembretes na grade (compromissos pessoais) ---------- */
function weekKey(d){ return localDateKey(weekStart(d || new Date())); }
function extrasDoDia(dia){
  const wk = weekKey();
  return (state.gradeExtras||[]).filter(x=>x.dia===dia && (!x.semana || x.semana===wk))
    .sort((a,b)=>(a.hora||'99:99').localeCompare(b.hora||'99:99'));
}
function extraFeito(x){ return x.semana ? !!x.feito : (x.feitoEm||[]).includes(weekKey()); }
function addExtra(){
  const texto = (document.getElementById('gx-texto')||{}).value || '';
  if(!texto.trim()){ aviso('Escreva o que é pra lembrar.'); return; }
  const dia = document.getElementById('gx-dia').value;
  const hora = document.getElementById('gx-hora').value || null;
  const rep = document.getElementById('gx-rep').checked;
  const wk = weekKey();
  state.gradeExtras = (state.gradeExtras||[]).filter(x=>!x.semana || x.semana>=wk);
  state.gradeExtras.push({id:uid(), dia, hora, texto:texto.trim(), semana: rep ? null : wk, feito:false, feitoEm:[], criadoEm:Date.now()});
  gradeDiaSel = dia;
  saveState(); render();
  aviso('Na grade: '+DAY_NAMES[dia]+(hora?' às '+hora:'')+(rep?' (toda semana)':''));
  const el = document.getElementById('gx-texto'); if(el) el.focus();
}
function toggleExtra(id){
  const x = (state.gradeExtras||[]).find(e=>e.id===id);
  if(!x) return;
  if(x.semana) x.feito = !x.feito;
  else {
    const wk = weekKey();
    x.feitoEm = x.feitoEm || [];
    x.feitoEm = x.feitoEm.includes(wk) ? x.feitoEm.filter(w=>w!==wk) : x.feitoEm.concat(wk).slice(-8);
  }
  saveState(); render();
}
async function apagarExtra(id){
  const x = (state.gradeExtras||[]).find(e=>e.id===id);
  if(!x) return;
  if(!(await confirmar(x.semana ? 'Tirar "'+x.texto+'" da grade?' : 'Tirar "'+x.texto+'" da grade? Ele repete toda semana, então sai de todas.'))) return;
  state.gradeExtras = state.gradeExtras.filter(e=>e.id!==id);
  saveState(); render();
}
let gradeDiaSel = null;
function irParaGrade(dia){
  gradeDiaSel = dia;
  setTab('semana');
  const el = document.getElementById('gx-texto');
  if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.focus({preventScroll:true}); }
}
function escolherDiaGrade(dia){
  gradeDiaSel = dia;
  const sel = document.getElementById('gx-dia'); if(sel) sel.value = dia;
  const el = document.getElementById('gx-texto');
  if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.focus({preventScroll:true}); }
}

function renderHoje(){
  const hoje = new Date();
  const dataTxt = hoje.toLocaleDateString('pt-BR',{day:'numeric', month:'long'});
  let html = '<div class="greet"><div><h1>'+greeting()+', Osmar</h1><p>'+DAY_FULL[todayKeyAny()]+', '+dataTxt+'</p></div></div>';

  const focusList = FOCUS[todayKeyAny()] || [];
  const fk = todayFullKey();
  const doneCount = focusList.filter((f,idx)=>state.blocoChecks[blocoCheckKey(fk, idx)]).length;
  const pct = focusList.length ? Math.round(doneCount/focusList.length*100) : 0;

  let blocos = '<div class="card">' + cardHead('target','Blocos de estudo','var(--accent)');
  if(focusList.length){
    blocos += '<div class="prog"><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><span class="n">'+doneCount+'/'+focusList.length+'</span></div>';
    blocos += focusList.map((f,idx)=>renderFocusItem(f, idx, fk)).join('');
    blocos += '<div class="hint" style="margin:12px 0 0">Horários sugeridos. Marcar aqui não conta como minutos estudados; pra isso use a sessão de estudo.</div>';
  } else {
    blocos += '<div class="empty">'+ic('coffee')+'Nenhum bloco sugerido pra hoje.</div>';
  }
  blocos += '</div>';

  let sessao = '<div class="card">' + cardHead('timer','Sessão de estudo','var(--s1)');
  if(state.active){
    sessao += '<div class="hint">A sessão está rodando na barra lá em cima. Anote os tópicos que for revisando:</div>';
    sessao += renderTopicsEditor();
  } else if(pendingNewSession){
    sessao += renderNewSessionFlow();
  } else {
    sessao += '<div class="hint">Escolha a matéria e o cronômetro começa.</div><div class="subj-grid">';
    const keys = Object.keys(state.subjects).sort((a,b)=>state.subjects[a].priority-state.subjects[b].priority);
    sessao += keys.map((k,i)=>{
      const s = state.subjects[k];
      const tag = s.priority===1 ? '<span class="s-tag hot">prioridade alta</span>' : '<span class="s-tag">padrão</span>';
      const wide = (keys.length%2===1 && i===keys.length-1) ? ' wide' : '';
      return '<button class="subj'+wide+'" style="--c:'+subjColor(k)+'" onclick="beginNewSessionFlow(\''+k+'\')">' +
        '<span class="s-ic">'+subjIcon(k)+'</span>' +
        '<span class="s-txt"><span class="s-name">'+s.name+'</span>'+tag+'</span>' +
      '</button>';
    }).join('');
    sessao += '</div>';
  }
  sessao += '</div>';

  html += '<div class="hoje-grid">' +
    '<div class="stack">' + renderAgendaHoje() + blocos + '</div>' +
    '<div class="stack">' + renderPendingTasksWidget() + sessao + renderDailyReview() + '</div>' +
  '</div>';
  return html;
}

function renderDailyReview(){
  const rev = getTodayReview();
  const emojis = ['😩','🙁','😐','🙂','🤩'];
  const nomes = ['Péssimo','Ruim','Ok','Bom','Ótimo'];
  const failedToday = failedOn(todayFullKey());
  let html = '<div class="card">' + cardHead('smile','Como foi seu dia?','var(--s2)');
  html += '<div class="hint">Uma nota rápida por dia ajuda a enxergar o padrão.</div>';
  if(failedToday>0){
    html += '<div class="alert">'+ic('alert')+'<span>'+failedToday+' tarefa'+(failedToday===1?'':'s')+' não cumprida'+(failedToday===1?'':'s')+' hoje, então "procrastinou" já ficou marcado.</span></div>';
  }
  html += '<div class="rates">' + [1,2,3,4,5].map(v=>{
    const sel = rev && rev.rating===v;
    return '<button class="rate'+(sel?' on':'')+'" onclick="setReviewRating('+v+')" title="'+nomes[v-1]+'" aria-label="Nota '+v+': '+nomes[v-1]+'">'+emojis[v-1]+'</button>';
  }).join('') + '</div>';
  html += '<div class="row" style="justify-content:space-between;margin-bottom:12px;">';
  html += '<span class="small" style="font-weight:600;color:var(--ink-2)">Procrastinou hoje?</span>';
  html += '<div class="seg"><button class="'+(rev&&rev.procrastinated===true?'on-bad':'')+'" onclick="setReviewProcrastinated(true)">Sim</button>' +
    '<button class="'+(rev&&rev.procrastinated===false?'on-good':'')+'" onclick="setReviewProcrastinated(false)">Não</button></div>';
  html += '</div>';
  html += '<textarea id="reviewNote" rows="2" placeholder="O que travou hoje? (opcional)" onblur="setReviewNote(this.value)">'+escapeHtml(rev&&rev.note?rev.note:'')+'</textarea>';
  if(rev && rev.rating && rev.updatedAt){
    html += '<div class="small muted" style="margin-top:8px;display:flex;align-items:center;gap:6px">'+ic('check')+'Salvo às '+new Date(rev.updatedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div>';
  }
  html += '</div>';
  return html;
}

function renderNewSessionFlow(){
  const k = pendingNewSession.subject;
  const s = state.subjects[k];
  const c = subjColor(k);
  let html = '<div class="col" style="--c:'+c+'">';
  html += '<div class="flow-head"><span class="s-ic">'+subjIcon(k)+'</span><div><b>'+s.name+'</b>'+(s.note?'<div class="small muted">'+s.note+'</div>':'')+'</div></div>';

  if(k==='hm'){
    html += '<div class="flow-q">Qual especialidade?</div><div class="opts">';

    html += '</div>';

function renderTopicsEditor(){
  const topics = state.active.topics;
  const c = subjColor(state.active.subject);
  let html = '<div class="topics" style="--c:'+c+'">';
  html += topics.map(t=>
    '<label class="topic'+(t.done?' done':'')+'">' +
      '<input type="checkbox" class="ck" '+(t.done?'checked':'')+' onchange="toggleTopic(\''+t.id+'\')">' +

      '<button class="icon-only" onclick="event.preventDefault();removeTopic(\''+t.id+'\')" aria-label="Remover tópico">'+ic('x')+'</button>' +
    '</label>'
  ).join('');
  html += '</div>';
  html += '<div class="add-line">' +
    '<input type="text" id="newTopicInput" placeholder="Tópico ou rodapé pra decorar…" onkeydown="if(event.key===\'Enter\'){addTopic(this.value);this.value=\'\';}">' +

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function blocoCheckKey(dateKey, idx){ return dateKey+'|'+idx; }
function toggleBlocoCheck(key){
  state.blocoChecks[key] = !state.blocoChecks[key];
  saveState(); render();
}
function renderFocusItem(f, idx, checkDateKey){
  const isGeral = !state.subjects[f.subject];
  const color = isGeral ? 'var(--ink-3)' : subjColor(f.subject);
  let extra = '';
  if(f.subtopic){ const x=HM_SUBTOPICS.find(h=>h.key===f.subtopic); if(x) extra=x.label; }
  if(f.mode){ const x=TUTORIA_MODES.find(h=>h.key===f.mode); if(x) extra=x.label; }
  const parts = String(f.time||'').split('–');
  const st = checkDateKey ? rangeState(parts[0], parts[1]) : '';
  const chipHtml = isGeral ? '<span class="chip" style="--c:var(--ink-3)">'+ic('layers')+'Organização</span>' : chip(f.subject);
  let checkbox = '', done = false;
  if(checkDateKey){
    const key = blocoCheckKey(checkDateKey, idx);
    done = !!state.blocoChecks[key];
    checkbox = '<input type="checkbox" class="ck" aria-label="Marcar bloco como feito" '+(done?'checked':'')+' onchange="toggleBlocoCheck(\''+key+'\')">';
  }
  const tag = checkDateKey ? 'label' : 'div';
  return '<'+tag+' class="blk'+(done?' done':'')+(st==='now' && !done?' now':'')+(checkDateKey?'':' static')+'" style="--c:'+color+'">' +
    checkbox +
    '<div class="b-main">' +
      '<div class="b-top">'+(f.time?'<span class="b-time">'+f.time+'</span>':'')+chipHtml+(extra?'<span class="b-extra">'+extra+'</span>':'')+(st==='now' && !done?'<span class="now-tag">agora</span>':'')+'</div>' +
      '<div class="b-note">'+f.note+'</div>' +
    '</div>' +
  '</'+tag+'>';
}
