/* ---------- progresso ---------- */

function renderProgresso(){
  const mins = weeklyMinutesBySubject();
  const fraction = weekdayProgressFraction();
  let html = renderPlacar();
  html += '<div class="card" style="margin-top:16px">' + cardHead('chart','Semana atual','var(--accent)');
  html += Object.keys(state.subjects).sort((a,b)=>state.subjects[a].priority-state.subjects[b].priority).map(k=>{
    const s = state.subjects[k];
    const actual = mins[k]||0;
    const target = s.weeklyTargetMin || 1;
    const pct = Math.min(100, Math.round(actual/target*100));
    const expected = target*fraction;
    const expPct = Math.min(100, Math.round(fraction*100));
    let status = '<span class="badge good">em dia</span>';
    if(actual < expected*0.5) status = '<span class="badge hot">atrasado</span>';
    else if(actual < expected*0.9) status = '<span class="badge warn">atenção</span>';
    return '<div class="subject-row" style="--c:'+subjColor(k)+'">' +
      '<div class="label"><span class="s-ic">'+subjIcon(k)+'</span><span>'+s.short+'</span></div>' +
      '<div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;"></div><span class="bar-mark" style="left:calc('+expPct+'% - 1px)" title="Onde deveria estar hoje"></span></div></div>' +
      '<div class="stat"><span class="mono">'+fmtDuration(actual*60000)+' / '+fmtDuration(target*60000)+'</span>'+status+'</div>' +
    '</div>';
  }).join('');
  html += '<div class="legend"><span><i></i>onde deveria estar até hoje</span></div>';
  html += '</div>';

  html += renderProcrastinacao();
  html += '<div class="grid2" style="margin-top:16px">' + renderReviewTrend() +
    '<div class="card">' + cardHead('grid','Últimos 35 dias','var(--accent)') + renderHeatmap() + '</div></div>';

  html += renderConcluidas();
  html += '<div class="card" style="margin-top:16px">' + cardHead('history','Histórico de sessões','var(--s4)');
  if(!state.sessions.length){
    html += '<div class="empty">'+ic('timer')+'Nenhuma sessão registrada ainda. Comece uma na aba Hoje.</div>';
  } else {
    html += state.sessions.slice(0,60).map(rec=>{
      const lbl = subjLabel(rec);
      const date = new Date(rec.endedAt);
      const dateStr = date.toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'}) + ' · ' + date.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      const topics = rec.topics || [];
      const doneTopics = topics.filter(t=>t.done).length;
      return '<div class="hist-item" style="--c:'+subjColor(rec.subject)+'">' +
        '<span class="s-ic" style="width:32px;height:32px;border-radius:9px">'+subjIcon(rec.subject)+'</span>' +
        '<div class="meta">' +
          '<div class="l1">'+lbl.name+(lbl.extra?' <span class="muted" style="font-weight:500">· '+lbl.extra+'</span>':'')+(rec.flagged?' <span class="flag">'+ic('alert')+'auto-encerrada</span>':'')+'</div>' +
          '<div class="l2">'+dateStr+(topics.length?' · '+doneTopics+'/'+topics.length+' tópicos':'')+'</div>' +
        '</div>' +
        '<div class="dur">'+fmtDuration(rec.durationMs)+'</div>' +
        '<button class="icon-only" onclick="deleteSession(\''+rec.id+'\')" title="Excluir sessão" aria-label="Excluir sessão">'+ic('trash')+'</button>' +
      '</div>';
    }).join('');
  }
  html += '</div>';
  return html;
}

/* ---------- placar: cumprimento x procrastinação ---------- */
function diaInfo(k){
  const r = state.dailyReviews[k];
  const falhas = failedOn(k);
  const largadas = state.sessions.filter(x=>x.flagged && localDateKey(new Date(x.endedAt))===k).length;
  const feitas = state.historico.filter(h=>h.kind==='done' && h.day===k).length;
  const estudo = dailyTotals()[k] || 0;
  const proc = (r && r.procrastinated===true) || falhas>0 || largadas>0;
  const bom = !proc && (feitas>0 || estudo>=15*60000 || (r && r.procrastinated===false));
  return {proc, bom, falhas, largadas, feitas, estudo, nota: r && r.rating};
}
function janela(desdeDias, ateDias){ // [hoje-desde+1 .. hoje-ate]
  const out = [];
  for(let i=desdeDias-1;i>=ateDias;i--) out.push(localDateKey(new Date(Date.now()-i*86400000)));
  return out;
}
function statsJanela(dias){
  const set = new Set(dias);
  const feitas = state.historico.filter(h=>h.kind==='done' && set.has(h.day)).length;
  const falhas = state.historico.filter(h=>h.kind==='failed' && set.has(h.day)).length;
  const procDias = dias.filter(k=>diaInfo(k).proc).length;
  return {feitas, falhas, total:feitas+falhas, pct: (feitas+falhas) ? Math.round(feitas/(feitas+falhas)*100) : null, procDias, n:dias.length};
}
function gaugeSvg(pct, color){
  const v = pct===null ? 0 : Math.max(0, Math.min(100, pct));
  return '<svg class="gauge" viewBox="0 0 140 82" aria-hidden="true">' +
    '<path d="M 14 72 A 56 56 0 0 1 126 72" fill="none" stroke="var(--sunken)" stroke-width="13" stroke-linecap="round"/>' +
    (v>0 ? '<path d="M 14 72 A 56 56 0 0 1 126 72" fill="none" stroke="'+color+'" stroke-width="13" stroke-linecap="round" pathLength="100" stroke-dasharray="'+v+' 100"/>' : '') +
  '</svg>';
}
function deltaHtml(atual, antes, maiorMelhor, unidade){
  if(atual===null || antes===null) return '<span class="delta muted">sem semana anterior pra comparar</span>';
  const d = atual - antes;
  if(d===0) return '<span class="delta muted">igual à semana anterior</span>';
  const bom = maiorMelhor ? d>0 : d<0;
  return '<span class="delta '+(bom?'up':'down')+'">'+ic(d>0?'arrowUp':'arrowDown')+Math.abs(d)+' '+unidade+' vs semana anterior</span>';
}
function nivelCumprimento(p){
  if(p===null) return {cor:'var(--ink-3)', txt:'Sem dados ainda'};
  if(p>=80) return {cor:'var(--good)', txt:'Mandando bem'};
  if(p>=50) return {cor:'var(--warn)', txt:'Dá pra melhorar'};
  return {cor:'var(--crit)', txt:'Hora de reagir'};
}
function nivelProc(d){
  if(d<=1) return {cor:'var(--good)', txt:'Sob controle'};
  if(d<=3) return {cor:'var(--warn)', txt:'Acendeu o alerta'};
  return {cor:'var(--crit)', txt:'Procrastinação alta'};
}
function renderPlacar(){

  const nc = nivelCumprimento(agora.pct);

  else if(agora.procDias < antes.procDias) frase = 'Menos dias de procrastinação que na semana passada. Tá funcionando.';

    '<div class="gauge-box">' +
      '<div class="g-wrap">'+gaugeSvg(agora.pct, 'var(--good)')+'<div class="g-num" style="color:'+'var(--good)'+'">'+(agora.pct===null?'—':agora.pct+'<small>%</small>')+'</div></div>' +
      '<div class="g-title">Cumprimento</div>' +
      '<div class="g-level" style="--c:'+'var(--good)'+'">'+ic(agora.pct!==null && agora.pct>=80?'check':(agora.pct===null?'clock':'alert'))+nc.txt+'</div>' +
      '<div class="g-sub">'+agora.feitas+' concluída'+(agora.feitas===1?'':'s')+' · '+agora.falhas+' não cumprida'+(agora.falhas===1?'':'s')+'</div>' +

    '<div class="gauge-box">' +
      '<div class="g-wrap">'+gaugeSvg(Math.round(agora.procDias/7*100), 'var(--crit)')+'<div class="g-num" style="color:'+'var(--crit)'+'">'+agora.procDias+'<small>/7</small></div></div>' +
      '<div class="g-title">Procrastinação</div>' +
      '<div class="g-level" style="--c:'+'var(--crit)'+'">'+ic(agora.procDias<=1?'check':'flame')+np.txt+'</div>' +
      '<div class="g-sub">dia'+(agora.procDias===1?'':'s')+' com procrastinação nesta semana</div>' +
      deltaHtml(agora.procDias, antes.n===7 ? antes.procDias : null, false, 'dia'+(Math.abs(agora.procDias-antes.procDias)===1?'':'s')) +

  '</div>';
  html += '<div class="placar-frase">'+ic('sparkle')+'<span>'+frase+'</span></div>';

  // 14 dias

  html += '<h3>Últimos 14 dias</h3><div class="strip">' + dias.map(k=>{
    const d = diaInfo(k);

    const dt = new Date(k+'T12:00:00');
    const partes = [];
    if(d.proc) partes.push('procrastinou');
    if(d.falhas) partes.push(d.falhas+' não cumprida'+(d.falhas===1?'':'s'));
    if(d.largadas) partes.push(d.largadas+' sessão largada');

    const tip = fmtDia(k)+(partes.length?' · '+partes.join(', '):' · sem registro');

function renderSemanasChart(){
  const narrow = (window.innerWidth||1000) < 560;
  const N = narrow ? 5 : 8;
  const ws = weekStart();
  const semanas = [];
  for(let i=N-1;i>=0;i--){
    const ini = new Date(ws); ini.setDate(ini.getDate()-7*i);
    const fim = new Date(ini); fim.setDate(fim.getDate()+7);
    const a = ini.getTime(), b = fim.getTime();
    const keys = []; for(let d=0; d<7; d++){ const x = new Date(ini); x.setDate(x.getDate()+d); keys.push(localDateKey(x)); }
    const set = new Set(keys);
    const feitas = state.historico.filter(h=>h.kind==='done' && set.has(h.day)).length;
    const falhas = state.historico.filter(h=>h.kind==='failed' && set.has(h.day)).length;
    semanas.push({ini, feitas, falhas, atual: i===0});
  }
  const max = Math.max(4, ...semanas.map(x=>Math.max(x.feitas, x.falhas)));
  const top = Math.ceil(max/2)*2;
  const W = narrow ? 360 : 560, H = narrow ? 210 : 190, padL=30, padR=8, padT=14, padB=30;
  const gw = (W-padL-padR)/N, bw = Math.min(16, gw*0.28);
  const y = v => H-padB - v/top*(H-padT-padB);
  let svg = '<svg class="wk-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tarefas concluídas e não cumpridas por semana">';
  [0, top/2, top].forEach(v=>{
    svg += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"'+(v===0?'':' stroke-dasharray="3 4"')+'/>';
    svg += '<text x="'+(padL-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" font-family="JetBrains Mono, monospace" fill="var(--ink-3)">'+v+'</text>';
  });
  semanas.forEach((w,i)=>{
    const cx = padL + gw*i + gw/2;
    const lbl = w.atual ? 'esta' : String(w.ini.getDate()).padStart(2,'0')+'/'+String(w.ini.getMonth()+1).padStart(2,'0');
    if(w.atual) svg += '<rect x="'+(padL+gw*i+2)+'" y="'+padT+'" width="'+(gw-4)+'" height="'+(H-padT-padB)+'" rx="8" fill="var(--accent)" fill-opacity=".07"/>';
    const bar = (v, x, color, nome)=>{
      if(!v) return '';
      const h = Math.max(3, H-padB - y(v));
      const yy = H-padB-h;
      return '<path d="M'+x+','+(H-padB)+' V'+(yy+4)+' Q'+x+','+yy+' '+(x+4)+','+yy+' H'+(x+bw-4)+' Q'+(x+bw)+','+yy+' '+(x+bw)+','+(yy+4)+' V'+(H-padB)+' Z" fill="'+color+'"><title>Semana de '+lbl+' · '+v+' '+nome+'</title></path>';
    };
    svg += bar(w.feitas, cx-bw-1, 'var(--good)', 'concluída'+(w.feitas===1?'':'s'));
    svg += bar(w.falhas, cx+1, 'var(--crit)', 'não cumprida'+(w.falhas===1?'':'s'));
    svg += '<rect x="'+(padL+gw*i)+'" y="'+padT+'" width="'+gw+'" height="'+(H-padT-padB)+'" fill="transparent"><title>Semana de '+lbl+': '+w.feitas+' concluídas, '+w.falhas+' não cumpridas'+((w.feitas+w.falhas)?' ('+Math.round(w.feitas/(w.feitas+w.falhas)*100)+'% cumprido)':'')+'</title></rect>';
    svg += '<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" font-family="JetBrains Mono, monospace" fill="'+(w.atual?'var(--accent)':'var(--ink-3)')+'" font-weight="'+(w.atual?'700':'400')+'">'+lbl+'</text>';
  });
  const atual = semanas[N-1];
  if(atual.feitas+atual.falhas){
    const cx = padL + gw*(N-1) + gw/2;
    const pct = Math.round(atual.feitas/(atual.feitas+atual.falhas)*100);
    svg += '<text x="'+cx+'" y="'+(y(Math.max(atual.feitas,atual.falhas))-6)+'" text-anchor="middle" font-size="11.5" font-weight="700" font-family="JetBrains Mono, monospace" fill="var(--ink)">'+pct+'%</text>';
  }
  svg += '</svg>';
  return '<div class="wk-wrap">'+svg+'</div><div class="legend"><span><span class="lg-sq ok"></span>concluídas</span><span><span class="lg-sq bad"></span>não cumpridas</span><span class="muted">toque numa semana pra ver o número</span></div>';
}

let mostrarTodasConcluidas = false;
function irPara(tab, anchor){

function fmtDia(key){
  const hoje = todayFullKey();
  const ontem = localDateKey(new Date(Date.now()-86400000));
  if(key===hoje) return 'Hoje';
  if(key===ontem) return 'Ontem';
  const d = new Date(key+'T12:00:00');
  const txt = d.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'2-digit'});
  return txt.charAt(0).toUpperCase()+txt.slice(1);
}
function blocosNaoFeitos(dayKey){
  const prefix = dayKey+'|';
  const marcou = Object.keys(state.blocoChecks).some(k=>k.startsWith(prefix) && state.blocoChecks[k]);
  if(!marcou) return null;
  const d = new Date(dayKey+'T12:00:00');
  const map = {0:'dom',1:'seg',2:'ter',3:'qua',4:'qui',5:'sex',6:'sab'};
  const lista = FOCUS[map[d.getDay()]] || [];
  const falt = lista.filter((f,idx)=>!state.blocoChecks[blocoCheckKey(dayKey, idx)]);

}

function renderProcrastinacao(){

  const limite = localDateKey(new Date(Date.now() - (DIAS-1)*86400000));
  const porDia = {};
  const add = (day, item)=>{ if(day < limite) return; (porDia[day] = porDia[day] || []).push(item); };

  const falhas = state.historico.filter(h=>h.kind==='failed');
  falhas.forEach(h=>add(h.day, {ord:1, html: histItem(h, true), subj:h.subject}));

  Object.keys(state.dailyReviews).forEach(k=>{
    const r = state.dailyReviews[k];
    if(r && r.procrastinated===true){
      const nota = r.note && r.note.trim() ? '<span class="log-note">“'+escapeHtml(r.note.trim())+'”</span>' : '<span class="muted">sem anotação do que travou</span>';
      add(k, {ord:0, html:'<div class="log-item" style="--c:var(--crit)"><span class="log-ic bad">'+ic('flame')+'</span>' +
        '<div class="log-main"><div class="log-top"><span class="log-text">Marcou que procrastinou</span>'+(r.rating?'<span class="badge soft">nota '+r.rating+'/5</span>':'')+'</div><div class="log-sub">'+nota+'</div></div></div>'});
    }
  });

  state.sessions.filter(x=>x.flagged).forEach(x=>{
    const day = localDateKey(new Date(x.endedAt));
    add(day, {ord:2, subj:x.subject, html:'<div class="log-item" style="--c:'+subjColor(x.subject)+'"><span class="log-ic warn">'+ic('timer')+'</span>' +
      '<div class="log-main"><div class="log-top">'+chip(x.subject)+'<span class="log-text">Sessão largada no meio</span><span class="badge soft">'+fmtDuration(x.durationMs)+'</span></div>' +
      '<div class="log-sub"><span>'+(x.note ? escapeHtml(x.note) : 'Encerrada sem resposta ao check-in')+'</span></div></div></div>'});
  });

  const hoje = todayFullKey();
  for(let i=1;i<DIAS;i++){

        '<div class="log-main"><div class="log-top"><span class="log-text">'+b.falt.length+' de '+b.total+' blocos de estudo ficaram sem fazer</span></div>' +
        '<div class="log-sub"><span>'+escapeHtml(nomes.join(', '))+'</span></div></div></div>'});
    }
  }

  const diasProc = Object.keys(state.dailyReviews).filter(k=>k>=limite && state.dailyReviews[k] && state.dailyReviews[k].procrastinated===true).length;
  const nFalhas = falhas.filter(h=>h.day>=limite).length;

  const cont = {};

  state.sessions.filter(x=>x.flagged && localDateKey(new Date(x.endedAt))>=limite).forEach(x=>{ cont[x.subject]=(cont[x.subject]||0)+1; });
  const top = Object.keys(cont).sort((a,b)=>cont[b]-cont[a])[0];

  let html = '<div class="card" id="procrast" style="margin-top:16px">' + cardHead('flame','Onde procrastinei','var(--crit)', '<span class="badge soft">30 dias</span>');
  html += '<div class="mini-stats">' +
    '<div class="ms" style="--c:var(--crit)"><b>'+nFalhas+'</b><span>tarefa'+(nFalhas===1?'':'s')+' não cumprida'+(nFalhas===1?'':'s')+'</span></div>' +
    '<div class="ms" style="--c:var(--s2)"><b>'+diasProc+'</b><span>dia'+(diasProc===1?'':'s')+' procrastinando</span></div>' +
    '<div class="ms" style="--c:var(--warn)"><b>'+nSess+'</b><span>sess'+(nSess===1?'ão largada':'ões largadas')+'</span></div>' +
    '<div class="ms" style="--c:'+(top?subjColor(top):'var(--ink-3)')+'">'+(top ? '<b class="ms-subj">'+subjIcon(top)+state.subjects[top].short+'</b><span>onde mais trava</span>' : '<b>—</b><span>onde mais trava</span>')+'</div>' +
  '</div>';

  }
  html += '<div class="hint" style="margin:12px 0 0">Entra aqui: tarefa marcada como "Não cumpri", dia em que você marcou que procrastinou, sessão largada sem responder o check-in e blocos que ficaram sem fazer nos dias em que você marcou algum.</div>';
  html += '</div>';

}

function renderReviewTrend(){
  const days = [];
  const today = new Date();
  for(let i=13;i>=0;i--){
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    days.push({key: localDateKey(d), d, rev: state.dailyReviews[localDateKey(d)]||null});
  }
  const rated = days.filter(x=>x.rev && x.rev.rating);

  let html = '<div class="card">' + cardHead('trend','Autoavaliação · 14 dias','var(--s2)');
  if(!rated.length){
    html += '<div class="empty">'+ic('smile')+'Ainda sem avaliações. Registre como foi seu dia na aba Hoje.</div></div>';
    return html;
  }
  const avg = rated.reduce((a,x)=>a+x.rev.rating,0)/rated.length;
  const procCount = rated.filter(x=>x.rev.procrastinated===true).length;

  const W=420, H=170, padL=26, padR=10, padT=12, padB=24;
  const stepX = (W-padL-padR)/(days.length-1);
  const yFor = v => H-padB - (v-1)/4*(H-padT-padB);
  const pts = days.map((x,i)=> (x.rev && x.rev.rating) ? {x: padL+i*stepX, y: yFor(x.rev.rating), v:x.rev.rating, proc:x.rev.procrastinated, key:x.key} : null);
  const real = pts.filter(Boolean);
  let line = '';
  real.forEach((p,i)=>{ line += (i===0?'M':'L') + p.x.toFixed(1)+','+p.y.toFixed(1)+' '; });
  let area = '';
  if(real.length>1){
    area = line + 'L'+real[real.length-1].x.toFixed(1)+','+(H-padB)+' L'+real[0].x.toFixed(1)+','+(H-padB)+' Z';
  }
  const emo = ['😩','🙁','😐','🙂','🤩'];
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;" role="img" aria-label="Notas dos últimos 14 dias">';
  for(let v=1; v<=5; v++){
    const y = yFor(v);
    svg += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    svg += '<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" font-family="JetBrains Mono, monospace" fill="var(--ink-3)">'+v+'</text>';
  }
  days.forEach((x,i)=>{
    if(i%2===1 && i!==days.length-1) return;
    const lab = i===days.length-1 ? 'hoje' : String(x.d.getDate()).padStart(2,'0');
    svg += '<text x="'+(padL+i*stepX)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, monospace" fill="var(--ink-3)">'+lab+'</text>';
  });
  if(area) svg += '<path d="'+area+'" fill="var(--s2)" fill-opacity=".12"/>';
  svg += '<path d="'+line.trim()+'" fill="none" stroke="var(--s2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  real.forEach(p=>{
    const color = p.proc===true ? 'var(--crit)' : (p.proc===false ? 'var(--good)' : 'var(--s2)');
    const failedOnDay = failedOn(p.key);
    const label = p.key+' · nota '+p.v+' '+emo[p.v-1]+(p.proc===true?' · procrastinou':(p.proc===false?' · sem procrastinar':''))+(failedOnDay?' · '+failedOnDay+' tarefa'+(failedOnDay===1?'':'s')+' não cumprida'+(failedOnDay===1?'':'s'):'');
    svg += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="5" fill="'+color+'" stroke="var(--surface)" stroke-width="2"><title>'+label+'</title></circle>';
  });
  svg += '</svg>';

  const failedInWindow = state.historico.filter(h=>h.kind==='failed' && days.some(d=>d.key===h.day)).length;
  html += svg;
  html += '<div class="stat-pair">' +
    '<span><b>'+avg.toFixed(1)+'</b>média</span>' +
    '<span><b style="color:var(--crit)">'+procCount+'</b>dia'+(procCount===1?'':'s')+' procrastinando</span>' +
    (failedInWindow ? '<span><b style="color:var(--warn)">'+failedInWindow+'</b>não cumprida'+(failedInWindow===1?'':'s')+'</span>' : '') +
  '</div>';
  html += '<div class="legend"><span><span class="tl-dot" style="margin:0;width:10px;height:10px;border:none;background:var(--good)"></span>sem procrastinar</span><span><span class="tl-dot" style="margin:0;width:10px;height:10px;border:none;background:var(--crit)"></span>procrastinou</span></div>';
  html += '</div>';
  return html;
}

function renderHeatmap(){
  const totals = dailyTotals();
  const today = new Date();
  const start = new Date(today.getFullYear(), today.getMonth(), today.getDate()-34);
  const lead = (start.getDay()+6)%7; // semana começando na segunda
  const cells = [];
  for(let i=0;i<lead;i++) cells.push('<div class="heat-cell blank"></div>');
  for(let i=34;i>=0;i--){
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate()-i);
    const key = localDateKey(d);
    const ms = totals[key]||0;
    let bucket = 0;
    if(ms>=180*60000) bucket=4;
    else if(ms>=90*60000) bucket=3;
    else if(ms>=30*60000) bucket=2;
    else if(ms>0) bucket=1;
    const lbl = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' · '+fmtDuration(ms);
    cells.push('<div class="heat-cell h'+bucket+(i===0?' today':'')+'" title="'+lbl+'"></div>');
  }
  return '<div class="heat-head"><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span></div>' +
    '<div class="heat-grid">'+cells.join('')+'</div>' +
    '<div class="heat-scale">menos <span class="heat-cell h0"></span><span class="heat-cell h1"></span><span class="heat-cell h2"></span><span class="heat-cell h3"></span><span class="heat-cell h4"></span> mais · 30 min / 1h30 / 3h</div>';
}

  html += '<label class="field" style="border-top:1px solid var(--line);margin-top:10px"><span>Avisos de prazo ('+notifStatusTxt()+')</span><button class="btn sm" onclick="requestNotifPermission()">'+ic('bell')+'Ativar</button></label>';
  html += '<div class="hint" style="margin:4px 0 0">Com as notificações ativadas, o Plantão avisa 24 h, 3 h e 30 min antes de cada prazo enquanto estiver aberto (mesmo minimizado).</div>';
  html += '</div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="grid2" style="margin-top:16px">';

  if(state.sync && state.sync.code){
    html += '<div class="hint">Este aparelho está sincronizado. Use este código nos outros aparelhos:</div>';
    html += '<div class="sync-code"><span class="code">'+state.sync.code+'</span><button class="btn sm" onclick="copiarCodigo()">'+ic('list')+'Copiar</button></div>';
    html += '<div class="row" style="margin-top:12px"><button class="btn sm ghost" onclick="stopSync()">Desligar neste aparelho</button></div>';

  html += '<div class="row" style="margin-bottom:12px"><button class="btn" onclick="copiarDados()">'+ic('list')+'Copiar meus dados</button></div>';

/* ---------- init ---------- */

function init(){
  let rT; window.addEventListener('resize', ()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(state.ui.tab==='progresso') render(); }, 250); });
  if(migrarHistorico()){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
  if(state.ui.theme) document.documentElement.setAttribute('data-theme', state.ui.theme);

  if(state.active && state.active.status==='running'){
    const now = Date.now();
    const sinceCheck = now - state.active.lastCheckInTs;
    const checkInMs = state.settings.checkInMinutes*60000;
    const graceMs = state.settings.graceMinutes*60000;
    if(sinceCheck > checkInMs + graceMs){
      const cutoff = state.active.lastCheckInTs;
      finishSession(cutoff, {flagged:true, note:'Encerrada automaticamente — o app ficou fechado por muito tempo.'});
    } else if(sinceCheck > checkInMs){
      issueCheckIn();
    }
  }

  window.addEventListener('storage', e=>{
    if(e.key===STORAGE_KEY){ state = loadState(); render(); }
  });
  assinar();
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ heartbeat(); cycleRecurringTasks(); checkTaskDeadlines(); } });

  setInterval(heartbeat, 10000);
  setInterval(updateLiveClock, 1000);
  setInterval(updateTaskCountdowns, 30000);
  setInterval(()=>{ cycleRecurringTasks(); checkTaskDeadlines(); }, 60000);
  cycleRecurringTasks();
  checkTaskDeadlines();

  render();
}

init();

</script>
